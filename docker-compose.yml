# Step 2 of Server_Design.md's build order (§3.2): a small local stack with real Redis + Postgres,
# so the compose orchestration itself is proven before any code changes. Both are now actually wired
# in: Redis since step 4 (Matchmaker's queue, Allocator's active-room registry), Postgres since step 5
# (PostgresUserRepository - see `apigateway`/`elowriter` below).
#
# `nats` was added as part of PLAN_split_6_services.md §3.0: it's the internal service-to-service bus
# (WS Gateway <-> Game Server Shards, Matchmaker <-> Game Allocator, etc.) - not the same role as
# redis, which holds registry/queue/session state instead (step 4).
#
# `shard` was added as part of §3.1: the first Game Server Shard, running the real GameSession(s) out
# of process. SHARD_ID must match one of `allocator`'s SHARD_IDS entries (today, trivially, since both
# default to a single "shard-1") - see GameShardRuntime's shardId filter. Since step 5, it publishes
# Elo updates over `nats` (server.persistence.BusEloWriter) instead of writing to a database directly -
# needs no DB connection of its own at all anymore.
#
# `gateway` was added as part of §3.2: the WS Gateway, holding every client socket - that's why the
# 8887 port mapping lives here, not on any other service. `gateway` and `shard` talk to each other
# directly over `nats` for gameplay traffic (server.gateway.GatewayRoomSession <-> the Shard). Also
# reads `redis` directly (server.auth.RedisSessionStore) to validate the session token every IDENTIFY
# carries - the architecture diagram's "sessions" row under Redis, closed this session: the client's
# userId/username/elo are looked up server-side from the token instead of being trusted as-is from
# whatever the client sends over the socket.
#
# `matchmaker` was added as part of §3.3: the ELO-range pairing queue, reaching `allocator` only over
# `nats` (server.matchmaking.BusRoomAllocationClient) - no direct dependency on `gateway` or `shard`.
# Since step 4, its waiting-queue data lives in `redis` (server.matchmaking.RedisWaitingPlayersQueue) -
# see that class's javadoc for exactly what is/isn't shared this way.
#
# `allocator` was added as part of §3.4: owns room creation/joining/cancellation and the active-room/
# reconnect registry, and picks which `shard` instance runs each room via round-robin over SHARD_IDS
# (server.allocator.ShardSelector) - a comma-separated list, so scaling to more than one `shard`
# replica later is just adding entries here and to `shard`'s own SHARD_ID. Since step 4, the active-
# room registry lives in `redis` too (server.allocator.RedisActiveRoomRegistry) - needs no database of
# its own at all (see GameAllocatorMain's javadoc).
#
# `apigateway` was added as part of §3.5: the one process that still owns AuthService/UserRepository,
# behind POST /login (8080, published so the Swing client can reach it directly - it needs no `nats`
# connection at all, unlike every other service here). With §3.3/§3.4/§3.5 all done, the original
# monolith (`server.ServerController`) had nothing left to run at all - RoomManager/MatchmakingService
# moved to `allocator`/`matchmaker`, and login moved here - so it and its `server` service were deleted
# outright rather than kept as an idle placeholder. Now also reads/writes `redis`
# (server.auth.RedisSessionStore): a successful /login issues a session token stored there with a
# 24h TTL, returned to the client alongside userId/username/elo - the token `gateway`'s IDENTIFY
# handler later validates instead of trusting client-supplied identity fields directly.
#
# `elowriter` was added as part of step 5: drains `shard`'s NATS-published Elo updates into Postgres
# in batches (server.persistence.EloWriterRuntime) instead of `shard` writing synchronously. Also runs
# server.persistence.GameHistoryWriterRuntime in the same process, draining `shard`'s NATS-published
# GAME_RECORDED/MOVE_RECORDED messages into the `games`/`moves` tables - the durable "games, results,
# move history" store the architecture diagram calls for. The only other process, besides
# `apigateway`, that touches a database - both point POSTGRES_URL at the same `postgres` instance/table
# so they agree on what they're reading/writing.
#
# Every service above builds from the single build-arg-driven root `Dockerfile` (§3.7) - JAR_CLASSIFIER
# picks which shaded jar (matching pom.xml's shade-plugin classifiers) becomes that container's
# app.jar - replacing near-identical per-process Dockerfiles.
#
# Every service also exposes a trivial /health endpoint (§3.6, HEALTH_PORT, default 8081 - see
# shared.health.HealthServer) - not published to the host since nothing outside these containers'
# shared network needs to reach it yet; a real orchestrator (K3s, §6) would probe it in-network the
# same way. (`apigateway` folds /health onto its existing HttpServer/PORT instead - see ApiGatewayMain.)
#
# Every service also exposes a Prometheus-text-format /metrics endpoint alongside /health (same
# HEALTH_PORT, see shared.metrics.MetricsRegistry/MetricsRestHandler) - request/success/failure
# counters and active-game/connection gauges per service, matching Server_Design.md's "metrics,
# alerts, traces" observability row. Prometheus/Alertmanager themselves are k8s-only (k8s/40-45-*.
# yaml) - not wired up in this compose stack, which only makes the numbers scrapeable.
#
# `jaeger` was added to close the "traces" part of that same observability row: `gateway` and
# `apigateway` both send it Zipkin v2 spans over plain HTTP (shared.tracing.JaegerReporter, no
# OpenTelemetry SDK dependency - matches this project's hand-rolled shared.metrics.MetricsRegistry
# style) via JAEGER_URL. Every span for a given request/NATS-message chain shares one traceId
# (shared.protocol.Message's new traceId field, threaded through shared.tracing.TraceContext),
# visible in Jaeger's UI at :16686 and in every ServerActivityLogger log line as `[trace=...]`.
# jaegertracing/all-in-one keeps everything in memory (traces vanish on restart) - fine for local
# dev, not a production tracing backend.
services:
  shard:
    build:
      context: .
      args:
        JAR_CLASSIFIER: shard
    environment:
      NATS_URL: "nats://nats:4222"
      SHARD_ID: "shard-1"
      HEALTH_PORT: "8081"
    volumes:
      - ./logs/shard:/app/logs/shard
    depends_on:
      - nats

  gateway:
    build:
      context: .
      args:
        JAR_CLASSIFIER: gateway
    ports:
      - "8887:8887"
    environment:
      PORT: "8887"
      NATS_URL: "nats://nats:4222"
      REDIS_URL: "redis://redis:6379"
      JAEGER_URL: "http://jaeger:9411/api/v2/spans"
      HEALTH_PORT: "8081"
    volumes:
      - ./logs/gateway:/app/logs/gateway
    depends_on:
      - nats
      - redis
      - shard
      - jaeger

  matchmaker:
    build:
      context: .
      args:
        JAR_CLASSIFIER: matchmaker
    environment:
      NATS_URL: "nats://nats:4222"
      REDIS_URL: "redis://redis:6379"
      HEALTH_PORT: "8081"
    volumes:
      - ./logs/matchmaker:/app/logs/matchmaker
    depends_on:
      - nats
      - redis
      - allocator

  allocator:
    build:
      context: .
      args:
        JAR_CLASSIFIER: allocator
    environment:
      NATS_URL: "nats://nats:4222"
      REDIS_URL: "redis://redis:6379"
      SHARD_IDS: "shard-1"
      HEALTH_PORT: "8081"
    volumes:
      - ./logs/allocator:/app/logs/allocator
    depends_on:
      - nats
      - redis

  apigateway:
    build:
      context: .
      args:
        JAR_CLASSIFIER: apigateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_URL: "jdbc:postgresql://postgres:5432/kungfu_chess?user=kungfu&password=kungfu"
      REDIS_URL: "redis://redis:6379"
      JAEGER_URL: "http://jaeger:9411/api/v2/spans"
    volumes:
      - ./logs/apigateway:/app/logs/apigateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    restart: on-failure

  elowriter:
    build:
      context: .
      args:
        JAR_CLASSIFIER: elowriter
    environment:
      NATS_URL: "nats://nats:4222"
      POSTGRES_URL: "jdbc:postgresql://postgres:5432/kungfu_chess?user=kungfu&password=kungfu"
      HEALTH_PORT: "8081"
    volumes:
      - ./logs/elowriter:/app/logs/elowriter
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"
      - "9411:9411"

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kungfu_chess
      POSTGRES_USER: kungfu
      POSTGRES_PASSWORD: kungfu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # the services that use the database wait until it accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kungfu -d kungfu_chess"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
