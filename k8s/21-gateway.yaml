# PLAN_split_6_services.md §3.2 - WS Gateway. Stateless relay (server.gateway.WsGatewayMain never
# decides game rules, only retransmits - Server_Design.md's explicit design rule), so this is the
# component actually safe to run with replicas > 1 today, unlike the shard above. One of the two
# services meant to be reachable from outside the cluster (see 30-ingress.yaml) - Server_Design.md
# §5: "WebSocket (בזמן אמת) → WS Gateway... תמיד אותה כתובת." Validates every IDENTIFY's session
# token against Redis (server.auth.RedisSessionStore, REDIS_URL already comes from the shared
# ConfigMap below) instead of trusting client-supplied userId/username/elo directly. Also reports a
# Jaeger span per inbound WS message (shared.tracing.Span/JaegerReporter, JAEGER_URL from the same
# ConfigMap - see 13-jaeger.yaml) and stamps every activity-log line with that message's traceId.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kungfu-chess
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: kungfu-chess:gateway
          ports:
            - containerPort: 8887
            - containerPort: 8081
          env:
            - name: PORT
              value: "8887"
          envFrom:
            - configMapRef: { name: kungfu-chess-config }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 1, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: kungfu-chess
spec:
  selector: { app: gateway }
  ports:
    - name: ws
      port: 8887
      targetPort: 8887
    - name: health
      port: 8081
      targetPort: 8081
