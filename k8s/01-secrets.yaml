# Demo-only credentials, matching docker-compose.yml's POSTGRES_USER/POSTGRES_PASSWORD exactly so
# the same PersistenceConfig.initialize()/POSTGRES_URL code path works unchanged in K3s. A real
# production deployment must replace this with a properly generated secret (sealed-secrets, an
# external secret manager, etc.) - this is the K3s-local-demo equivalent of docker-compose.yml's
# already-plaintext `POSTGRES_PASSWORD: kungfu`, not a hardening step.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: kungfu-chess
type: Opaque
stringData:
  POSTGRES_DB: kungfu_chess
  POSTGRES_USER: kungfu
  POSTGRES_PASSWORD: kungfu
  POSTGRES_URL: "jdbc:postgresql://postgres:5432/kungfu_chess?user=kungfu&password=kungfu"
