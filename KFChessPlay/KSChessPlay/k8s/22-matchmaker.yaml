# PLAN_split_6_services.md §3.3 - Matchmaker. Stateless: its waiting-queue lives in Redis
# (RedisWaitingPlayersQueue), so any replica can pick up any pending match - safe to run >1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
  namespace: kungfu-chess
spec:
  replicas: 2
  selector:
    matchLabels: { app: matchmaker }
  template:
    metadata:
      labels: { app: matchmaker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: matchmaker
          image: kungfu-chess:matchmaker
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: kungfu-chess-config }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker
  namespace: kungfu-chess
spec:
  selector: { app: matchmaker }
  ports:
    - port: 8081
      targetPort: 8081
